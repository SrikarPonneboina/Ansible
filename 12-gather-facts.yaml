- name: gather Ansible facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    debug:
      msg: "{{ ansible_facts }}"
  - name: print some info
    debug:
      msg: |
        OS Family: {{ ansible_facts['os_family'] }}
        private_ip: {{ ansible_facts.default_ipv4.address }} 
        private_ip: {{ ansible_facts['default_ipv4']['address'] }}

#for private_ip the output is same we are taking output from ansible_facts and
#checking them {{ ansible_facts.default_ipv4.address }} from ansible_facts
#from default_ipv4 we are taking address

