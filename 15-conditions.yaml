- name: print OS is RedHat or not
  hosts: local
  connection: local
  tasks:
  - name: Install nginx in RedHat
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat"
  
  - name: Install nginx in Debian
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debian"