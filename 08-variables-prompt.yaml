- name: variable from user input prompt
  hosts: local
  connection: local
  vars_prompt:
  - name: name
    prompt: please enter your name
    private: no
  
  - course: "Ansible from prompt" 
    prompt: plese enter what are you learning
    private: yes

  tasks:
  - name: Printing variables from the user input - prompt
    debug: 
      msg: "Hello {{ name }} and your learning {{ course }}"
    
  - name: printing variables from task 2
    vars: 
      name: Srikar
      course: Ansible
    debug:
      msg: "Hi my name is {{ name }}, I'm learning {{ course }}"