- name: using filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, shell, Ansible"
    names:
    - Srikar
    - avinash
    - ponneboina
    topic: ANSIBLE
    duration: "4"
  tasks:
  - name: print default person name
    debug:
      msg: "Hi, {{ person_name | default('Ramesh') }}"

  - name: convert comma-seperated string to a list 
    ansible.builtin.debug:
      msg: "{{ topics }} : {{ topics.split(', ') }}"
  
  - name: convert list to string
    debug:
      msg: "Full name: {{ names | join(', ') }}"
  
  - name: convert to lower case letter
    debug:
      msg: "Topic changed to lowercase: {{ topic | lower }}"
  
  - name: convert int to string
    debug:
      msg: "Duration changed to int: {{ duration | int }}"