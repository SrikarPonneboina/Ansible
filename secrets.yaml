- name: aws secrets manager 
  hosts: local
  connection: local
  tasks:
  - name: print the secret key from aws secret manager
    debug:
      #msg: "{{ lookup('amazon.aws.secretsmanager_secret', 'roboshop/dev/ansible', region='us-east-1') }}"
      msg: "{{ lookup('amazon.aws.secretsmanager_secret', 'roboshop/dev/ansible.ansible_user', nested=true, region='us-east-1') }}"


# Before you can use amazon.aws.secretsmanager_secret with the nested=true parameter, you must have the amazon.aws collection installed on the machine running the playbook.
# ansible-galaxy collection install amazon.aws
# ansible-galaxy collection list === verify the installation

# You also need the Python library boto3 installed on your system for that collection to talk to AWS. If you haven't already, make sure to install it via pip:
# pip install boto3


# nested=true (Enabled)
# When you set nested=true, you change the behavior of the lookup string. It instructs Ansible to:
# 1. Fetch the secret container (roboshop/dev/ansible).
# 2. Parse the string payload directly as a structured JSON object.
# 3. Follow the dot path you appended (like .mysql_root_password) to extract only that exact nested string value, ignoring everything else.


# lookup is a core feature in Ansible, and amazon.aws.secretsmanager_secret is the specific lookup plugin being used here.

#                1. Look inside AWS Secrets Manager
#                │
#    ┌───────────┴─────────────┐
# "{{ lookup('amazon.aws.secretsmanager_secret', 'roboshop/dev/ansible.ansible_user', nested=true, region='us-east-1') }}"
#                                                 └─────────────────┬────────────────┘ └──────────┬──┘ └───────┬──────┘
#                                                                   │                             │            │
#              2. Find the secret container named                 ──┘                             │            │
#                 "roboshop/dev/ansible" and look                                                 │            │
#                 specifically for the "ansible_user" key.                                        │            │
#                                                                                                 │            │
#              3. "nested=true" means: Parse the JSON data natively  ─────────────────────────────┘            │
#                 and return *only* the value of that key, rather                                              │
#                 than dumping the entire raw JSON text block.                                                 │
#                                                                                                              │
#              4. Look for it inside the Virginia data center (us-east-1). ────────────────────────────────────┘
