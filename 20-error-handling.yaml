- name: error handling in yaml
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: user roboshop exists or not
    command: id roboshop # Linux command, when there is no ansoble module exists we can use linux commands
    register: user_output #register is the keyword it takes output of command - id roboshop and stores in user_output
    ignore_errors: true # for knows errors we can use ignore errors

  - name: printing user
    debug:
      msg: "{{ user_output }}"

  - name: creating user roboshop
    command: useradd roboshop
    when: user_output.rc != 0

  - name: print success message
    debug:
      msg: "User created successfully"
    when: user_output.changed