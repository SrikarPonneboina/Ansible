- name: error handling in yaml
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: user roboshop exists or not
    command: id roboshop
    register: user_output
    ignore_errors: true

  - name: printing user
    debug:
      msg: "{{ user_output }}"

  - name: creating user roboshop
    command: useradd roboshop
    when: user_output.rc != 0

  - name: print success message
    debug:
      msg: "User created successfully"
    when: user_output.changed