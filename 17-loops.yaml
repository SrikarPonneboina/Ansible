- name: Loops
  hosts: local
  connection: local
  vars:
    package:
    - nginx
    - mysql
    - htop
  tasks:
  - name: Install package
    package:
      state: present
      name: "{{ item }}" #here item referes to loop package
    loop: "{{ package }}"
    debug:
      msg: "Hi Installing {{ package }}"
    