#Points to be noted
---
# 1. SCALAR TYPES (Basic Key-Value Pairs)
string_unquoted: Hello World
string_quoted: "Use quotes for special characters, like a colon: or emoji"
integer_value: 42
float_value: 3.14159
boolean_true: true      # Can also be 'yes' or 'on'
boolean_false: false    # Can also be 'no' or 'off'
null_value: null        # Can also use ~ or leave blank

# 2. COLLECTIONS (Lists / Sequences)
# Block style list (preferred for readability)
programming_languages:
  - Python
  - JavaScript
  - Rust

# Flow style list (JSON-like inline array)
frameworks: [React, Django, FastAPI]

# 3. MAPPINGS (Dictionaries / Objects / Nested Data)
user_profile:
  username: dev_guru
  active: true
  roles:
    - admin
    - developer

# 4. MIXED COMPLEX STRUCTURES (List of Objects)
servers:
  - host: 192.168.1.10
    role: web-server
    ports: [80, 443]
  - host: 192.168.1.11
    role: db-server
    ports:
      - 5432

# 5. MULTI-LINE STRINGS
# Literal Block (|) preserves newlines exactly as written
preserve_newlines: |
  This is line one.
  This is line two.
  Every line break remains.

# Folded Block (>) converts single newlines into spaces
fold_newlines: >
  This long sentence will be interpreted
  as a single continuous line of text,
  which is great for long descriptions.

